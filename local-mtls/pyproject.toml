# このディレクトリは Python 3.13 以上で実行します。
[project]
name = "local-mtls"
version = "0.1.0"
description = "ローカル環境で TLS と mTLS を学ぶためのサンプル"
requires-python = ">=3.13"
# 実行時に必要な外部ライブラリはありません。
dependencies = []

# pytest と Ruff はテスト・コード整形・静的検査に使う開発用依存関係です。
[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.17.2",
]

# このサンプルは配布用パッケージではなく、uv run で実行します。
[tool.uv]
package = false

# 配布パッケージとしてインストールせず、プロジェクト直下のコードをテストから読み込む。
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Python 3.13 を対象に、1行の長さを120文字として整形します。
[tool.ruff]
target-version = "py313"
line-length = 120

# 基本的な構文・未使用変数などの検査と、import の並び順の検査を有効にします。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
